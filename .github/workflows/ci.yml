name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: ruff check and ruff format --check
        run: make lint

  test:
    # Unit tests against the fake vim module; no Vim needed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # make the locale tests fail instead of skip if the locale is missing
      REQUIRE_LOCALE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the fr_FR.UTF-8 locale
        # tests/test_liborgdate_utf8.py
        run: |
          sudo locale-gen fr_FR.UTF-8
          locale -a
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Run the unit tests
        run: |
          python -m coverage run -m pytest --ignore=tests/integration -ra
          python -m coverage report

  integration:
    # Runs the plugin in a real Vim, using the distribution's Python (the one
    # Vim is linked against) rather than one from setup-python
    runs-on: ubuntu-latest
    env:
      # fail instead of skipping if there is no Vim with +python3
      REQUIRE_VIM: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Vim with Python 3 support
        run: |
          sudo apt-get update
          sudo apt-get install -y vim-nox python3-venv
      - name: Check that Vim has +python3
        run: |
          vim --version | head -n 3
          vim --version | grep -F '+python3'
      - name: Install dev tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --group dev
      - name: Run the integration tests
        run: .venv/bin/python -m pytest tests/integration -ra

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Build the documentation (warnings are errors)
        run: make docs
